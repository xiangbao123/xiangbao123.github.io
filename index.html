<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>北门NB</title>

    <!-- 小猫咪 favicon（SVG 内联） -->

    <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='36' fill='%23FAD9C1'/%3E%3Cpath d='M18 30 L35 6 L46 30 Z' fill='%23FAD9C1'/%3E%3Cpath d='M25 26 L35 12 L42 26 Z' fill='%23FFB6C1'/%3E%3Cpath d='M54 30 L65 6 L82 30 Z' fill='%23FAD9C1'/%3E%3Cpath d='M58 26 L65 12 L75 26 Z' fill='%23FFB6C1'/%3E%3Cellipse cx='35' cy='50' rx='8' ry='9' fill='%232D2D2D'/%3E%3Ccircle cx='32' cy='46' r='3' fill='white'/%3E%3Ccircle cx='38' cy='52' r='1.5' fill='white'/%3E%3Cellipse cx='65' cy='50' rx='8' ry='9' fill='%232D2D2D'/%3E%3Ccircle cx='62' cy='46' r='3' fill='white'/%3E%3Ccircle cx='68' cy='52' r='1.5' fill='white'/%3E%3Cpolygon points='46,59 54,59 50,63' fill='%23FF8A9B'/%3E%3Cpath d='M43 68 Q50 74 57 68' stroke='%232D2D2D' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3Cline x1='10' y1='55' x2='30' y2='59' stroke='%232D2D2D' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='10' y1='62' x2='30' y2='64' stroke='%232D2D2D' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='70' y1='59' x2='90' y2='55' stroke='%232D2D2D' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='70' y1='64' x2='90' y2='62' stroke='%232D2D2D' stroke-width='1.5' stroke-linecap='round'/%3E%3Cellipse cx='24' cy='64' rx='6' ry='4' fill='%23FFB6C1' opacity='0.55'/%3E%3Cellipse cx='76' cy='64' rx='6' ry='4' fill='%23FFB6C1' opacity='0.55'/%3E%3C/svg%3E" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZrIlqimvLuWJ2rLTqJ60yWkBSfQIGsQACcicAAkreUVS3acnz8W7Itj0E.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center center;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .brand-card {
            background-color: rgba(20, 20, 30, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 2.2rem 3rem;
            border-radius: 32px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            transition: all 0.2s;
        }

        h1 {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-shadow: 4px 4px 16px rgba(0, 0, 0, 0.85);
            word-break: keep-all;
            margin: 0 0 0.6rem 0;
        }

        .sub {
            font-size: 0.9rem;
            letter-spacing: 6px;
            opacity: 0.7;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 1rem;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.5rem;
            margin-bottom: 1.8rem;
        }

        .btn {
            flex: 1 1 180px;
            min-width: 140px;
            padding: 0.9rem 1.2rem;
            border: none;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
        }

        .btn:active {
            transform: translateY(1px) scale(0.97);
        }

        .btn-nekobounce {
            background: rgba(100, 180, 255, 0.20);
            border-color: rgba(100, 180, 255, 0.35);
        }
        .btn-nekobounce:hover {
            background: rgba(100, 180, 255, 0.32);
            border-color: rgba(100, 200, 255, 0.6);
        }

        .btn-涩涩 {
            background: rgba(255, 120, 180, 0.20);
            border-color: rgba(255, 120, 180, 0.35);
        }
        .btn-涩涩:hover {
            background: rgba(255, 120, 180, 0.32);
            border-color: rgba(255, 150, 200, 0.6);
        }

        .game-area {
            margin-top: 0.8rem;
            padding: 1.2rem 1rem;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: all 0.2s;
            user-select: none;
        }

        .game-area .cat-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.4rem 0;
        }

        .cat-avatar {
            font-size: 4.8rem;
            line-height: 1.2;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        .cat-avatar:hover {
            transform: scale(1.08) rotate(-4deg);
        }

        .cat-avatar:active {
            transform: scale(0.92) rotate(2deg);
        }

        .cat-speech {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            color: #fff6e8;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            margin: 0 auto;
        }

        .cat-hint {
            font-size: 0.75rem;
            opacity: 0.5;
            letter-spacing: 2px;
            margin-top: 0.2rem;
        }

        /* IP 底部信息 */
        .ip-footer {
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.10);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .ip-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.4rem 0.6rem;
        }

        .ip-label {
            opacity: 0.8;
            font-weight: 400;
        }

        .ip-address {
            font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
            font-weight: 600;
            font-size: 1.05rem;
            color: #b8e2ff;
            text-shadow: 0 0 12px rgba(100, 200, 255, 0.25);
            letter-spacing: 0.5px;
            min-width: 80px;
            display: inline-block;
        }

        .ip-warning {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.05rem;
            color: #ffab6b;
            text-shadow: 0 0 20px rgba(255, 150, 50, 0.25), 0 2px 8px rgba(0, 0, 0, 0.6);
            background: rgba(255, 120, 50, 0.10);
            padding: 0.25rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 150, 80, 0.20);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            animation: warningPulse 2.4s ease-in-out infinite;
        }

        .ip-warning .lightning {
            display: inline-block;
            animation: lightningFlicker 1.8s ease-in-out infinite alternate;
        }

        @keyframes warningPulse {
            0%, 100% { opacity: 0.75; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes lightningFlicker {
            0%, 90% { opacity: 1; }
            95% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .ip-address.loading::after {
            content: '';
            animation: dots 1.4s steps(4, end) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        @media (max-width: 550px) {
            h1 { font-size: 3.8rem; letter-spacing: 3px; }
            .brand-card { padding: 1.8rem 1.5rem; }
            .btn { font-size: 1.1rem; padding: 0.75rem 1rem; min-width: 120px; flex: 1 1 140px; }
            .sub { font-size: 0.75rem; letter-spacing: 4px; }
            .cat-avatar { font-size: 3.8rem; }
            .cat-speech { font-size: 1rem; padding: 0.4rem 1.2rem; min-height: 2.8rem; }
            .game-area { padding: 1rem 0.8rem; }
            .ip-footer { font-size: 0.85rem; margin-top: 1.4rem; padding-top: 1rem; }
            .ip-address { font-size: 0.95rem; }
            .ip-warning { font-size: 0.95rem; padding: 0.2rem 1rem; }
        }

        @media (max-width: 400px) {
            .button-group { flex-direction: column; align-items: stretch; }
            .btn { flex: 1 1 auto; width: 100%; }
            .ip-row { flex-direction: column; gap: 0.2rem; }
        }
    </style>
</head>
<body>
    <div class="brand-card">
        <h1>北门NB</h1>
        <div class="sub">✦ 不止于北门 ✦</div>

        <div class="button-group">
            <a href="https://nekobounce.qzz.io/" target="_blank" rel="noopener noreferrer" class="btn btn-nekobounce">🐾 nekobounce</a>
            <a href="https://www.pixiv.net/users/104419511" target="_blank" rel="noopener noreferrer" class="btn btn-涩涩">✦ 涩涩</a>
        </div>

        <div class="game-area" id="gameArea">
            <div class="cat-container" id="catContainer">
                <div class="cat-avatar" id="catAvatar">😺</div>
                <div class="cat-speech" id="catSpeech">戳戳我～</div>
                <div class="cat-hint">✦ 点击猫娘互动 ✦</div>
            </div>
        </div>

        <div class="ip-footer">
            <div class="ip-row">
                <span class="ip-label">🌐 你的IP：</span>
                <span class="ip-address loading" id="visitorIp">获取中</span>
            </div>
            <div class="ip-warning">
                <span class="lightning">⚡</span>
                看代码者DDOS打击
                <span class="lightning">⚡</span>
            </div>
        </div>
    </div>

    <script>
        // 猫娘互动
        (function() {
            var speeches = [
                "喵～ 你好呀！",
                "今天也元气满满！",
                "最喜欢你啦 ❤️",
                "要一起玩吗？",
                "摸摸头～ (´▽`ʃ♡)ƪ",
                "北门最棒了！",
                "嘿嘿，好开心～",
                "给你小鱼干 🐟",
                "晚上好喵～",
                "我超可爱的！",
                "抱抱～ (*≧▽≦)",
                "你点我干嘛啦 >_<",
                "再点我就要生气了！",
                "骗你的，我才不生气呢",
                "一起去看星星吧 ✨",
                "喵喵喵～",
                "今天的月亮好圆",
                "要听我唱歌吗？",
                "我是你的猫娘哦",
                "最喜欢这个网页了！"
            ];

            var avatar = document.getElementById('catAvatar');
            var speech = document.getElementById('catSpeech');
            var container = document.getElementById('catContainer');

            var emojiState = 0;
            var emojis = ['😺', '😸', '😻', '😽', '🙀', '😹', '🐱', '😼'];

            function getRandomSpeech() {
                return speeches[Math.floor(Math.random() * speeches.length)];
            }

            function nextEmoji() {
                emojiState = (emojiState + 1) % emojis.length;
                return emojis[emojiState];
            }

            function interact() {
                avatar.textContent = nextEmoji();
                speech.textContent = getRandomSpeech();

                avatar.style.transition = 'transform 0.1s';
                avatar.style.transform = 'scale(1.2)';
                setTimeout(function() {
                    avatar.style.transform = 'scale(1)';
                }, 100);

                speech.style.transition = 'background 0.15s';
                speech.style.background = 'rgba(255, 200, 150, 0.3)';
                setTimeout(function() {
                    speech.style.background = 'rgba(0, 0, 0, 0.25)';
                }, 200);
            }

            container.addEventListener('click', interact);
            container.addEventListener('touchstart', function(e) {
                interact();
            }, { passive: true });
        })();

        // 获取访客 IP
        (function() {
            var ipEl = document.getElementById('visitorIp');

            window.handleIP = function(data) {
                if (data && data.ip) {
                    ipEl.textContent = data.ip;
                    ipEl.classList.remove('loading');
                } else {
                    ipEl.textContent = '获取失败';
                    ipEl.classList.remove('loading');
                }
            };

            var timeout = setTimeout(function() {
                if (ipEl.textContent === '获取中') {
                    ipEl.textContent = '未能获取 (请检查网络)';
                    ipEl.classList.remove('loading');
                }
            }, 5000);

            try {
                var script = document.createElement('script');
                script.src = 'https://api.ipify.org?format=jsonp&callback=handleIP';
                script.async = true;
                script.onerror = function() {
                    clearTimeout(timeout);
                    if (ipEl.textContent === '获取中') {
                        ipEl.textContent = '请求失败 (请刷新)';
                        ipEl.classList.remove('loading');
                    }
                };
                document.head.appendChild(script);
            } catch (e) {
                clearTimeout(timeout);
                ipEl.textContent = '请求异常';
                ipEl.classList.remove('loading');
            }
        })();
    </script>
</body>
</html>
