    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZrIlqimvLuWJ2rLTqJ60yWkBSfQIGsQACcicAAkreUVS3acnz8W7Itj0E.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center center;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            color: #e8e0d0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .brand-card {
            background: rgba(12, 12, 18, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.4rem 3rem;
            border-radius: 36px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(212, 175, 55, 0.25);
            border: 1px solid rgba(212, 175, 55, 0.15);
            text-align: center;
            transition: all 0.2s;
        }

        h1 {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #f5e6a3 0%, #d4af37 40%, #b8860b 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.25);
            margin: 0 0 0.6rem 0;
            word-break: keep-all;
        }

        .sub {
            font-size: 0.9rem;
            letter-spacing: 6px;
            opacity: 0.7;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 1rem;
            color: #c9b896;
            font-weight: 300;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.5rem;
            margin-bottom: 1.8rem;
        }

        .btn {
            flex: 1 1 180px;
            min-width: 140px;
            padding: 0.9rem 1.2rem;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #1a1a1a;
            background: linear-gradient(135deg, #f5e6a3, #d4af37);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
            font-family: inherit;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 36px rgba(212, 175, 55, 0.45);
            background: linear-gradient(135deg, #fff0c0, #e0c050);
            border-color: rgba(255, 215, 0, 0.6);
        }

        .btn:active {
            transform: translateY(1px) scale(0.97);
        }

        .btn-nekobounce {
            background: linear-gradient(135deg, #e0d6c0, #b8a88a);
            color: #1e1a14;
            border-color: rgba(180, 160, 130, 0.4);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .btn-nekobounce:hover {
            background: linear-gradient(135deg, #f0e6d0, #c8b89a);
            border-color: rgba(200, 180, 150, 0.7);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
        }

        .btn-涩涩 {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #1a140a;
            border-color: rgba(212, 175, 55, 0.5);
        }
        .btn-涩涩:hover {
            background: linear-gradient(135deg, #e8c850, #c89820);
            border-color: rgba(212, 175, 55, 0.8);
        }

        .btn-history {
            background: linear-gradient(135deg, #2a2a2a, #0d0d0d);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        .btn-history:hover {
            background: linear-gradient(135deg, #3d3d3d, #1a1a1a);
            border-color: rgba(212, 175, 55, 0.9);
            box-shadow: 0 14px 36px rgba(212, 175, 55, 0.2);
            transform: translateY(-3px) scale(1.02);
        }

        .game-area {
            margin-top: 0.8rem;
            padding: 1.2rem 1rem;
            background: rgba(20, 20, 28, 0.5);
            border-radius: 28px;
            border: 1px solid rgba(212, 175, 55, 0.12);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: all 0.2s;
            user-select: none;
        }

        .game-area .cat-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.4rem 0;
        }

        .cat-avatar {
            font-size: 4.8rem;
            line-height: 1.2;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 4px 16px rgba(212, 175, 55, 0.25));
        }

        .cat-avatar:hover {
            transform: scale(1.08) rotate(-4deg);
        }

        .cat-avatar:active {
            transform: scale(0.92) rotate(2deg);
        }

        .cat-speech {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.45);
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            min-height: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            color: #f0e6d0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            max-width: 90%;
            margin: 0 auto;
        }

        .cat-hint {
            font-size: 0.75rem;
            opacity: 0.45;
            letter-spacing: 2px;
            margin-top: 0.2rem;
            color: #b8a88a;
        }

        .ip-footer {
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(212, 175, 55, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            color: rgba(200, 190, 175, 0.8);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .ip-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.4rem 0.6rem;
        }

        .ip-label {
            opacity: 0.75;
            font-weight: 300;
        }

        .ip-address {
            font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
            font-weight: 500;
            font-size: 1.05rem;
            color: #d4af37;
            text-shadow: 0 0 24px rgba(212, 175, 55, 0.2);
            letter-spacing: 0.5px;
            min-width: 80px;
            display: inline-block;
        }

        .ip-warning {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.05rem;
            color: #d4af37;
            text-shadow: 0 0 24px rgba(212, 175, 55, 0.2), 0 2px 8px rgba(0, 0, 0, 0.6);
            background: rgba(212, 175, 55, 0.08);
            padding: 0.25rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            animation: warningPulse 2.4s ease-in-out infinite;
        }

        .ip-warning .lightning {
            display: inline-block;
            animation: lightningFlicker 1.8s ease-in-out infinite alternate;
        }

        @keyframes warningPulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes lightningFlicker {
            0%, 90% { opacity: 1; }
            95% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .ip-address.loading::after {
            content: '';
            animation: dots 1.4s steps(4, end) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        @media (max-width: 550px) {
            h1 {
                font-size: 3.8rem;
                letter-spacing: 4px;
            }
            .brand-card {
                padding: 1.8rem 1.5rem;
            }
            .btn {
                font-size: 1.0rem;
                padding: 0.75rem 1rem;
                min-width: 120px;
                flex: 1 1 140px;
            }
            .sub {
                font-size: 0.75rem;
                letter-spacing: 4px;
            }
            .cat-avatar {
                font-size: 3.8rem;
            }
            .cat-speech {
                font-size: 1rem;
                padding: 0.4rem 1.2rem;
                min-height: 2.8rem;
            }
            .game-area {
                padding: 1rem 0.8rem;
            }
            .ip-footer {
                font-size: 0.85rem;
                margin-top: 1.4rem;
                padding-top: 1rem;
            }
            .ip-address {
                font-size: 0.95rem;
            }
            .ip-warning {
                font-size: 0.95rem;
                padding: 0.2rem 1rem;
            }
        }

        @media (max-width: 400px) {
            .button-group {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                flex: 1 1 auto;
                width: 100%;
            }
            .ip-row {
                flex-direction: column;
                gap: 0.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="brand-card">
        <h1>北门NB</h1>
        <div class="sub">✦ 不止于北门 ✦</div>

        <div class="button-group">
            <a href="https://nekobounce.qzz.io/" target="_blank" rel="noopener noreferrer" class="btn btn-nekobounce">🐾 nekobounce</a>
            <a href="https://www.pixiv.net/users/104419511" target="_blank" rel="noopener noreferrer" class="btn btn-涩涩">✦ 涩涩</a>
            <a href="https://www.bilibili.com/video/BV1GJ411x7h7?t=35.1" target="_blank" rel="noopener noreferrer" class="btn btn-history">📜 北门的黑历史</a>
        </div>

        <div class="game-area" id="gameArea">
            <div class="cat-container" id="catContainer">
                <div class="cat-avatar" id="catAvatar">😺</div>
                <div class="cat-speech" id="catSpeech">戳戳我～</div>
                <div class="cat-hint">✦ 点击猫娘互动 ✦</div>
            </div>
        </div>

        <div class="ip-footer">
            <div class="ip-row">
                <span class="ip-label">🌐 你的IP：</span>
                <span class="ip-address loading" id="visitorIp">获取中</span>
            </div>
            <div class="ip-warning">
                <span class="lightning">⚡</span>
                看代码者DDOS打击
                <span class="lightning">⚡</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var speeches = [
                "喵～ 你好呀！",
                "今天也元气满满！",
                "最喜欢你啦 ❤️",
                "要一起玩吗？",
                "摸摸头～ (´▽`ʃ♡)ƪ",
                "北门最棒了！",
                "嘿嘿，好开心～",
                "给你小鱼干 🐟",
                "晚上好喵～",
                "我超可爱的！",
                "抱抱～ (*≧▽≦)",
                "你点我干嘛啦 >_<",
                "再点我就要生气了！",
                "骗你的，我才不生气呢",
                "一起去看星星吧 ✨",
                "喵喵喵～",
                "今天的月亮好圆",
                "要听我唱歌吗？",
                "我是你的猫娘哦",
                "最喜欢这个网页了！"
            ];

            var avatar = document.getElementById('catAvatar');
            var speech = document.getElementById('catSpeech');
            var container = document.getElementById('catContainer');

            var emojiState = 0;
            var emojis = ['😺', '😸', '😻', '😽', '🙀', '😹', '🐱', '😼'];

            function getRandomSpeech() {
                return speeches[Math.floor(Math.random() * speeches.length)];
            }

            function nextEmoji() {
                emojiState = (emojiState + 1) % emojis.length;
                return emojis[emojiState];
            }

            function interact() {
                avatar.textContent = nextEmoji();
                speech.textContent = getRandomSpeech();

                avatar.style.transition = 'transform 0.1s';
                avatar.style.transform = 'scale(1.2)';
                setTimeout(function() {
                    avatar.style.transform = 'scale(1)';
                }, 100);

                speech.style.transition = 'background 0.15s';
                speech.style.background = 'rgba(212, 175, 55, 0.25)';
                setTimeout(function() {
                    speech.style.background = 'rgba(0, 0, 0, 0.45)';
                }, 200);
            }

            container.addEventListener('click', interact);
            container.addEventListener('touchstart', function(e) {
                interact();
            }, { passive: true });
        })();

        (function() {
            var ipEl = document.getElementById('visitorIp');

            window.handleIP = function(data) {
                if (data && data.ip) {
                    ipEl.textContent = data.ip;
                    ipEl.classList.remove('loading');
                } else {
                    ipEl.textContent = '获取失败';
                    ipEl.classList.remove('loading');
                }
            };

            var timeout = setTimeout(function() {
                if (ipEl.textContent === '获取中') {
                    ipEl.textContent = '127.0.0.1<开玩笑:)>';
                    ipEl.classList.remove('loading');
                }
            }, 5000);

            try {
                var script = document.createElement('script');
                script.src = 'https://api.ipify.org?format=jsonp&callback=handleIP';
                script.async = true;
                script.onerror = function() {
                    clearTimeout(timeout);
                    if (ipEl.textContent === '获取中') {
                        ipEl.textContent = '127.0.0.1<开玩笑:)>';
                        ipEl.classList.remove('loading');
                    }
                };
                document.head.appendChild(script);
            } catch (e) {
                clearTimeout(timeout);
                ipEl.textContent = '127.0.0.1<开玩笑:)>';
                ipEl.classList.remove('loading');
            }
        })();
    </script>
</body>
</html>
